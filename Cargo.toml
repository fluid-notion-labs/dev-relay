[package]
name = "dev-relay"
version = "0.1.0"
edition = "2024"
description = "Dev tool: LAN build publisher + HTTP file server + log relay with a tiny MCP query endpoint, plus a client lib for self-updating apps and remote log streaming"

[lib]
name = "dev_relay"
path = "src/lib.rs"

[[bin]]
name = "dev-relay"
path = "src/bin/dev-relay.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
